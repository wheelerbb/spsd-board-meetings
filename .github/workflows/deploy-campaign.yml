name: Deploy campaign copy (wheelerforspsd.org)

# Second publishing destination: builds the campaign-recolored variant (campaign/) and deploys
# it as a Cloudflare Worker at wheelerforspsd.org/spsd-board-meetings/. Kept separate from
# deploy.yml so it can be removed by deleting this file and campaign/. See campaign/README.md.

on:
  # Runs after every main pipeline run so both sites publish the same content. The checkout
  # below is latest main, which includes the pipeline's own auto-update commit.
  workflow_run:
    workflows: ["Automate, Build, and Deploy"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build campaign variant
        run: npx @11ty/eleventy --config=campaign/eleventy.config.js

      - name: Deploy to Cloudflare
        working-directory: campaign
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.40.0 deploy
