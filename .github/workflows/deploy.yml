name: Automate, Build, and Deploy

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 8:00 AM UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass TTL cache and re-fetch all sources'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai pydantic pyyaml python-dotenv google-api-python-client google-cloud-storage pypdf
          
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'
          
      - name: Run Ingestion Pipeline
        run: |
          # 1. Check Google Drive for new documents and create stubs
          python scripts/source_data.py --bucket "${{ vars.GCS_BUCKET_URI }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}

          # 2. Process any unprocessed transcripts (Drive VTTs + bucket-stored historical VTTs)
          python scripts/process_transcripts.py --batch --bucket "${{ vars.GCS_BUCKET_URI }}"

          # 3. Post-process to update library, generate blurbs, and synthesize summaries
          python scripts/post_process.py --bucket "${{ vars.GCS_BUCKET_URI }}"
          
      - name: Commit Automated Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/meetings/ src/_data/ scripts/topic_hashes.json vimeo_master_list.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: auto-update meeting stubs and summaries"
          git pull --rebase origin main
          git push
          
      - name: Install NPM Dependencies
        run: npm ci
        
      - name: Build Eleventy Site
        run: npm run build
        
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: process_and_build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
