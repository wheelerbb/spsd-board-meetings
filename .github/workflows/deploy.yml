name: Automate, Build, and Deploy

on:
  schedule:
    - cron: '0 8 * * *' # Run daily at 8:00 AM UTC
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force:
        description: 'Bypass TTL cache and re-fetch all sources'
        type: boolean
        default: false
      meeting_slug:
        description: 'Reprocess only this meeting (e.g. 2024-04-08) instead of the normal --batch run'
        type: string
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  process_and_build:
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.source_data.outputs.changes }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 google-genai pydantic pyyaml python-dotenv google-api-python-client google-cloud-storage pypdf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      # Always runs, even on a scheduled tick with nothing new — this is what decides
      # whether there IS anything new. Cheap (no LLM calls), so no gating needed here.
      - name: Source data (Apptegy/site/Drive/Vimeo/transcripts)
        id: source_data
        run: |
          python scripts/source_data.py --bucket "${{ vars.GCS_BUCKET_URI }}" ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      # On a scheduled run with nothing new, everything below is skipped — pushes to main
      # and manual runs always proceed regardless of what source_data.py found.
      - name: Process transcripts
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: |
          if [ -n "${{ github.event.inputs.meeting_slug }}" ]; then
            python scripts/process_transcripts.py "${{ github.event.inputs.meeting_slug }}" --bucket "${{ vars.GCS_BUCKET_URI }}"
          else
            python scripts/process_transcripts.py --batch --bucket "${{ vars.GCS_BUCKET_URI }}"
          fi

      - name: Post-process
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: python scripts/post_process.py --bucket "${{ vars.GCS_BUCKET_URI }}"

      # Pulls sourcing_log.json / processing_log.json down from GCS for the /processing-log/
      # page. Only done here (not from source_data.py directly) so a no-op cron tick never
      # touches src/_data/ and never produces a commit — see scripts/pipeline_log.py.
      - name: Sync processing log for build
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: python -c "import sys; sys.path.insert(0, 'scripts'); import pipeline_log; pipeline_log.sync_local_copy('${{ vars.GCS_BUCKET_URI }}')"

      - name: Commit Automated Changes
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add src/meetings/ src/_data/ scripts/topic_hashes.json vimeo_master_list.json
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "chore: auto-update meeting stubs and summaries"
          git pull --rebase origin main
          git push

      - name: Install NPM Dependencies
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: npm ci

      - name: Build Eleventy Site
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        run: npm run build

      - name: Upload Pages Artifact
        if: ${{ github.event_name != 'schedule' || steps.source_data.outputs.changes == 'true' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: process_and_build
    if: ${{ github.event_name != 'schedule' || needs.process_and_build.outputs.changes == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
